name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: idream
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d idream"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      DB_PROVIDER: postgresql
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/idream
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/idream_test
      REDIS_URL: redis://127.0.0.1:6379/15
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PG_SUPER: postgres
      PGPASSWORD: postgres
      CHAT_REDIS_URL: redis://127.0.0.1:6379/14
      PW_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Check packages
        run: bun run check

      - name: Test admin
        run: bun run --filter @idream/admin test

      - name: Check main coverage
        run: bun run --filter @idream/main coverage

      - name: Test chat
        run: bun run --filter @idream/chat test

      - name: Test generation workers
        run: bun run --filter @idream/gen test

      - name: Test shared contracts
        run: bun run --filter @idream/shared test

      - name: Test PM2 production orchestration
        run: bun run test:pm2-config

      - name: Rehearse migration chain
        run: |
          bun run --filter @idream/main db:migrate:deploy
          bun run --filter @idream/main check:migration-authority
          bun run --filter @idream/main admin:readiness:migrations

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Bootstrap Chat E2E runtime
        env:
          DSH_HOME: ${{ runner.temp }}/idream-dsh
          # Bootstrap creates manifests and lockfiles for these disposable profiles.
          npm_config_frozen_lockfile: "false"
        run: |
          python -m pip install igrep2==0.1.150
          npm install --prefix "$RUNNER_TEMP/idream-ci-tools" --no-audit --no-fund pnpm@10.33.0
          export PATH="$RUNNER_TEMP/idream-ci-tools/node_modules/.bin:$PATH"
          printf '%s\n' "$RUNNER_TEMP/idream-ci-tools/node_modules/.bin" >> "$GITHUB_PATH"
          node scripts/setup-dsh-companion.mjs --json > "$RUNNER_TEMP/dsh-bootstrap.json"
          node scripts/setup-dsh-companion.mjs --check --json
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          import { execFileSync } from "node:child_process";
          import { join } from "node:path";
          import { pathToFileURL } from "node:url";

          const report = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, "dsh-bootstrap.json"), "utf8"));
          const normal = report.profiles.find(profile => profile.memoryMode === "normal");
          if (!report.ok || !normal?.installedPluginPath) throw new Error("Missing installed normal companion profile");
          const environment = {
            DSH_HOME: report.dshHome,
            DSH_BOOTSTRAP_STATE_PATH: report.statePath,
            DSH_IGREP_PLUGIN_URL: pathToFileURL(join(normal.installedPluginPath, "index.mjs")).href,
            DSH_IGREP_COMMAND: execFileSync("which", ["igrep"], { encoding: "utf8" }).trim(),
          };
          appendFileSync(process.env.GITHUB_ENV, Object.entries(environment).map(([key, value]) => `${key}=${value}\n`).join(""));
          NODE

      - name: Run E2E
        env:
          PW_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/idream_test
          PW_REDIS_URL: redis://127.0.0.1:6379/14
        run: bun run --filter @idream/main test:e2e

      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: packages/main/test-results/
          retention-days: 7
          if-no-files-found: ignore
